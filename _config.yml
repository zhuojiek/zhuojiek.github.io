title: Zhuojie Kuang
description: Zhuojie Kuang — robot learning, generative models, and RL. CS at UC Berkeley.
url: https://zhuojiekuang.github.io
baseurl: ""
repository: zhuojiekuang/zhuojiekuang.github.io
locale: en-US
timezone: America/Los_Angeles

author:
  name: Zhuojie Kuang
  email: anthonykuang@berkeley.edu
  github: shimamooo

# Build
markdown: kramdown
highlighter: rouge
excerpt_separator: "<!--more-->"
future: true
permalink: /posts/:year/:month/:day/:title/

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  math_engine: mathjax
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  syntax_highlighter: rouge

collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post, section: writing }
  - scope: { path: "", type: publications }
    values: { layout: research }
  - scope: { path: "", type: pages }
    values: { layout: page }

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

feed:
  path: feed.xml

include:
  - _pages
  - files

# The academicpages template files below are no longer used by the site.
# They are excluded from the build so none of the template sample pages get published.
exclude:
  - .bundle
  - .devcontainer
  - .github
  - .sass-cache
  - vendor
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CONTRIBUTING.md
  - Dockerfile
  - docker-compose.yaml
  - _config_docker.yml
  - package.json
  - assets
  - _sass
  - _talks
  - _teaching
  - _portfolio
  - _drafts
  - markdown_generator
  - scripts
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - talkmap_out.ipynb
  - _pages/terms.md
  - _pages/cv-json.md
  - _pages/cv.md
  - _pages/talks.html
  - _pages/portfolio.html
  - _pages/markdown.md
  - _pages/non-menu-page.md
  - _pages/archive-layout-with-content.md
  - _pages/collection-archive.html
  - _pages/category-archive.html
  - _pages/tag-archive.html
  - _pages/page-archive.html
  - _pages/sitemap.md
  - _pages/talkmap.html
  - _pages/year-archive.html
  - _pages/wip.md
  - images/themes
  - files/paper1.pdf
  - files/paper2.pdf
  - files/paper3.pdf
  - files/slides1.pdf
  - files/slides2.pdf
  - files/slides3.pdf
  - files/bibtex1.bib
