---
layout: base
sidebar: true
---
<article class="page">
  {% unless page.hide_title %}
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="dek">{{ page.description }}</p>{% endif %}
  </header>
  {% endunless %}
  <div class="page-body">
    {{ content }}
  </div>
</article>
