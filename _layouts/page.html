---
layout: base
---
<article class="page{% if page.wide %} page-wide{% endif %}">
  {% unless page.hide_title %}
  <header class="page-header">
    {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="dek">{{ page.description }}</p>{% endif %}
  </header>
  {% endunless %}
  <div class="page-body">
    {{ content }}
  </div>
</article>
