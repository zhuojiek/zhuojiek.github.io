{% comment %} Embedded X posts from _data/tweets.yml, newest first. {% endcomment %}
<div class="x-posts">
{% for url in site.data.tweets %}
  <blockquote class="twitter-tweet" data-dnt="true"><a href="{{ url | replace: 'x.com', 'twitter.com' }}">View post on X</a></blockquote>
{% endfor %}
</div>
<script>
  (function () {
    var root = document.documentElement;
    var box = document.querySelector('.x-posts');
    var source = box.innerHTML;
    var isDark = function () {
      var t = root.getAttribute('data-theme');
      return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    };
    var theme = isDark() ? 'dark' : 'light';
    var setTheme = function () { box.querySelectorAll('blockquote').forEach(function (b) { b.setAttribute('data-theme', theme); }); };
    setTheme();
    // X fixes the theme when it draws an embed, so redraw them when the site theme changes.
    var retheme = function () {
      var next = isDark() ? 'dark' : 'light';
      if (next === theme || !window.twttr || !twttr.widgets) return;
      theme = next; box.innerHTML = source; setTheme(); twttr.widgets.load(box);
    };
    new MutationObserver(retheme).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
    var s = document.createElement('script');
    s.src = 'https://platform.twitter.com/widgets.js'; s.async = true; s.charset = 'utf-8';
    document.body.appendChild(s);
  })();
</script>
